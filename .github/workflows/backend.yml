name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: Lint, types, import contracts and tests
        run: ./check.sh

  images:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Build API image locally
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: backend
          target: api
          build-args: RELEASE_SHA=${{ github.sha }}
          tags: idraft-api:ci
          load: true
      - name: Build worker image locally
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: backend
          target: worker
          build-args: RELEASE_SHA=${{ github.sha }}
          tags: idraft-worker:ci
          load: true
      - name: Build migrator image locally
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: backend
          target: migrator
          build-args: RELEASE_SHA=${{ github.sha }}
          tags: idraft-migrator:ci
          load: true
      - name: Smoke test all targets against real PostgreSQL and Redis
        run: backend/smoke.sh idraft-api:ci idraft-worker:ci idraft-migrator:ci
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The images that passed the smoke test are the ones pushed: nothing is rebuilt between the test and the push.
      - name: Push the tested API and worker images and record their digests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          OWNER: ${{ github.repository_owner }}
          COMMIT: ${{ github.sha }}
        run: |
          owner="${OWNER,,}"
          mkdir -p "$RUNNER_TEMP/digests"
          refs=()
          for role in api worker; do
            repo="ghcr.io/$owner/idraft-$role"
            docker tag "idraft-$role:ci" "$repo:$COMMIT"
            docker push "$repo:$COMMIT"
            ref="$(docker image inspect "$repo:$COMMIT" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep "^$repo@sha256:" | head -n 1)"
            [ -n "$ref" ] || { echo "No registry digest for $repo:$COMMIT after the push." >&2; exit 1; }
            echo "$role image: $ref" >> "$GITHUB_STEP_SUMMARY"
            refs+=("$ref")
          done
          jq -n --arg api "${refs[0]}" --arg worker "${refs[1]}" '{api: $api, worker: $worker}' > "$RUNNER_TEMP/digests/backend-digests.json"
      - name: Upload backend digests artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: backend-digests
          path: ${{ runner.temp }}/digests/backend-digests.json
