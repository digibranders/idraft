name: web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      # The generated client is checked against the API document (apps/web/src/lib/api/schema.test.ts)
      - "backend/openapi/v1.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "backend/openapi/v1.json"
      - ".github/workflows/web.yml"

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Reads the pnpm version from packageManager in the root package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: apps/web
        run: pnpm lint
      - name: Types
        working-directory: apps/web
        run: pnpm typecheck
      - name: Unit tests
        working-directory: apps/web
        run: pnpm test
      - name: Formatting
        working-directory: apps/web
        run: pnpm format:check
      - name: Build against the real API (no mocks)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_MOCKING: "off"
          NEXT_PUBLIC_RELEASE: ${{ github.sha }}
          # Read at runtime by server components; the build only needs a valid value
          API_INTERNAL_ORIGIN: http://127.0.0.1:8000
        run: pnpm build
