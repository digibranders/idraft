name: web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      # The generated client is checked against the API document (apps/web/src/lib/api/schema.test.ts)
      - "backend/openapi/v1.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "backend/openapi/v1.json"
      - ".github/workflows/web.yml"

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Reads the pnpm version from packageManager in the root package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: apps/web
        run: pnpm lint
      - name: Types
        working-directory: apps/web
        run: pnpm typecheck
      - name: Unit tests
        working-directory: apps/web
        run: pnpm test
      - name: Formatting
        working-directory: apps/web
        run: pnpm format:check
      - name: Build against the real API (no mocks)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_MOCKING: "off"
          NEXT_PUBLIC_RELEASE: ${{ github.sha }}
          # Read at runtime by server components; the build only needs a valid value
          API_INTERNAL_ORIGIN: http://127.0.0.1:8000
        run: pnpm build

  image:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push web image
        id: web
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: apps/web/Dockerfile
          target: runtime
          build-args: |
            NEXT_PUBLIC_APP_ENV=production
            NEXT_PUBLIC_API_MOCKING=off
            NEXT_PUBLIC_RELEASE=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/idraft-web:${{ github.sha }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Record digest and upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/digests
          web_ref="ghcr.io/${{ github.repository_owner }}/idraft-web@${{ steps.web.outputs.digest }}"
          echo "Web image: $web_ref" >> "$GITHUB_STEP_SUMMARY"
          printf '{"web":"%s"}\n' "$web_ref" > /tmp/digests/web-digests.json
      - name: Upload web digest artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: web-digests
          path: /tmp/digests/web-digests.json
