[project]
name = "sightline"
version = "0.1.0"
description = "SEO and AI search visibility platform: API and worker"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiobotocore>=3.9.1",
    "aiohttp>=3.14.3",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.1",
    "fastapi>=0.142.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyotp>=2.10.0",
    "redis>=8.1.0",
    "sentry-sdk[fastapi]>=2.71.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "structlog>=26.1.0",
    "taskiq>=0.13.0",
    "taskiq-redis>=1.2.4",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.54.0",
    "zstandard>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sightline"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
# S608: no SQL built from strings in application code (docs/24-security.md section 4).
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "C4", "T20", "N", "S608"]

[tool.ruff.lint.per-file-ignores]
# Revisions and tests build statements from constants in the same file, never from input.
"src/sightline/db/migrations/versions/*" = ["S608"]
"tests/*" = ["S608"]

[tool.ruff.lint.isort]
known-first-party = ["sightline"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "asgi_lifespan.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # taskiq-redis builds a pipeline for every read of a stream and does not close it when the
    # receiver is stopped in the middle of one. redis-py then closes the connection when the
    # pipeline is collected, and says so. It happens once per receiver, as the process stops.
    "ignore:Unclosed client session <redis.asyncio.client.Pipeline:ResourceWarning",
]
addopts = "-ra --strict-markers --cov=sightline --cov-branch --cov-report=term-missing:skip-covered --cov-fail-under=90"

[tool.coverage.run]
omit = ["src/sightline/db/migrations/*"]
# SQLAlchemy's async layer runs on greenlets; without this, lines after an awaited query are
# reported as missed.
concurrency = ["greenlet", "thread"]

[tool.importlinter]
root_package = "sightline"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain is pure: no internal imports, no I/O libraries"
type = "forbidden"
source_modules = ["sightline.domain"]
forbidden_modules = [
  "sightline.api", "sightline.worker", "sightline.collectors", "sightline.providers",
  "sightline.db", "sightline.storage", "sightline.config", "sightline.extraction",
  "sqlalchemy", "asyncpg", "redis", "httpx", "fastapi", "starlette",
]

[[tool.importlinter.contracts]]
name = "extraction is pure: no internal imports, no I/O libraries"
type = "forbidden"
source_modules = ["sightline.extraction"]
forbidden_modules = [
  "sightline.api", "sightline.worker", "sightline.collectors", "sightline.providers",
  "sightline.db", "sightline.storage", "sightline.config", "sightline.domain",
  "sqlalchemy", "asyncpg", "redis", "httpx", "fastapi", "starlette",
]

[[tool.importlinter.contracts]]
name = "providers never touch the database"
type = "forbidden"
source_modules = ["sightline.providers"]
forbidden_modules = [
  "sightline.db", "sightline.api", "sightline.worker", "sightline.collectors",
  "sqlalchemy", "asyncpg",
]

[[tool.importlinter.contracts]]
name = "lower layers never import the entrypoints"
type = "forbidden"
source_modules = ["sightline.collectors", "sightline.db", "sightline.storage", "sightline.config"]
forbidden_modules = ["sightline.api", "sightline.worker"]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "asyncpg-stubs>=0.31.3",
    "hypothesis>=6.168.3",
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "testcontainers[postgres,redis]>=4.15.0",
    "types-aiobotocore[s3]>=3.9.1",
]
