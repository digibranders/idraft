# app.idraft.ai on the shared VPS. Installed as /etc/nginx/sites-available/idraft by infra/vps/provision.sh.
#
# Behind Cloudflare (proxied): the firewall admits 80 and 443 from Cloudflare's ranges only, like the other sites on this
# host. Cloudflare's SSL mode for the zone must be Full (strict once the certificate below exists).
#
# Routes: /api/ to the API on 127.0.0.1:8010, everything else to the Next.js app on 127.0.0.1:3010. Another project holds
# 127.0.0.1:8000, so idraft's API is on 8010.
#
# Client address: only Cloudflare can reach this port, so CF-Connecting-IP is trusted here and nowhere else. It becomes
# $remote_addr and is passed on as X-Forwarded-For (replaced, not appended), which uvicorn trusts from 127.0.0.1.
#
# TLS: /etc/nginx/idraft-tls.conf names the certificate. provision.sh first writes a self-signed stand-in (Cloudflare's
# Full mode accepts it), then `provision.sh tls` swaps in the Let's Encrypt certificate and reloads.

limit_req_zone $binary_remote_addr zone=idraft_general:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name app.idraft.ai;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/idraft-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    # nginx 1.24 (Ubuntu 24.04) has no `http2 on;`: http2 goes on the listen lines.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.idraft.ai;
    server_tokens off;

    include /etc/nginx/idraft-tls.conf;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:idraft_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/idraft.access.log;
    error_log  /var/log/nginx/idraft.error.log;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # The same headers the application gateway of the Compose design sets (infra/compose/caddy/Caddyfile). The upstream's
    # own copies are hidden so none is sent twice.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Powered-By;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 2s;
    proxy_read_timeout 60s;

    limit_req zone=idraft_general burst=120 nodelay;
    client_max_body_size 1m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/idraft-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # The keyword import upload is the only route that takes a file; the backend enforces its own limit
    # (backend/src/idraft/api/body_limit.py): 50 MiB of file plus 1 MiB of multipart framing.
    location ~ ^/api/v1/workspaces/[^/]+/projects/[^/]+/keyword-imports/upload$ {
        client_max_body_size 51m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8010;
    }

    # /api/internal/health is protected by its bearer token in the backend; /api/readyz is public on purpose.
    location /api/ {
        proxy_pass http://127.0.0.1:8010;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
    }
}
