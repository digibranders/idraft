# infra/compose/postgres/pg_hba.conf
# TYPE  DATABASE  USER                         ADDRESS          METHOD
local   all       postgres                                      peer
local   all       backup                                        peer map=backup_map
local   all       all                                           reject
host    all       app_api,app_worker,migrator  172.30.10.0/24   scram-sha-256
host    all       app_api,app_worker,migrator  127.0.0.1/32     scram-sha-256
host    all       all                          0.0.0.0/0        reject
host    all       all                          ::/0             reject
