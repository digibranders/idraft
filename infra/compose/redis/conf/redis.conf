# infra/compose/redis/conf/redis.conf
# Redis 8 configuration (plan decision D9)

bind 0.0.0.0
port 6379
protected-mode yes
aclfile /usr/local/etc/redis/acl/users.acl

# Memory: queue messages, locks and limiter state must never be evicted
maxmemory 512mb
maxmemory-policy noeviction

# Persistence: AOF every second with RDB preamble, plus periodic RDB
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
save 900 1 300 100
dir /data

# Hardening
enable-debug-command no
enable-module-command no
enable-protected-configs no

# Diagnostics
latency-monitor-threshold 100
slowlog-log-slower-than 10000
slowlog-max-len 256
tcp-keepalive 300
