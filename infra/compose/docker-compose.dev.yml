# Local development only: PostgreSQL 18 and Redis 8 on loopback ports that do not collide with
# a Homebrew PostgreSQL or Redis. Production is infra/compose/docker-compose.yml.
#
# The role script runs when the data volume is first created. After changing it, recreate the
# volume: docker compose -f infra/compose/docker-compose.dev.yml down -v
name: sightline-dev

services:
  postgres:
    image: postgres:18
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-dev
      POSTGRES_DB: sightline
      # Development values only. Production reads these from /etc/seo-platform/.env.
      PG_MIGRATOR_PASSWORD: migrator-dev
      PG_API_PASSWORD: api-dev
      PG_WORKER_PASSWORD: worker-dev
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sightline"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:63799:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # An S3 API that checks signatures, standing in for R2 (raw answers, import sources). The same
  # gateway the test suite uses. Development keys only; the bucket is made by `make-bucket`.
  objects:
    image: versity/versitygw:v1.8.0
    environment:
      ROOT_ACCESS_KEY: dev-access-key
      ROOT_SECRET_KEY: dev-secret-key-for-raw-storage
      VGW_REGION: auto
      VGW_BACKEND: posix
      VGW_BACKEND_ARG: /data
    ports:
      - "127.0.0.1:17070:7070"
    volumes:
      - object-data:/data

volumes:
  postgres-data:
  redis-data:
  object-data:
