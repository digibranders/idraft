# Local development only: PostgreSQL 18 and Redis 8 on loopback ports that do not collide with
# a Homebrew PostgreSQL or Redis. Production is infra/compose/docker-compose.yml.
name: sightline-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: sightline
      POSTGRES_PASSWORD: sightline
      POSTGRES_DB: sightline
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sightline -d sightline"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:63799:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
